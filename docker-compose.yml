services:

  postgres:
    image: postgres:18
    container_name: ecom-postgres
    environment:
      POSTGRES_DB: Ecomedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    image: ecom-crud-app:1.0
    container_name: ecom-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: